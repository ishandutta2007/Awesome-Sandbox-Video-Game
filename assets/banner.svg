<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: 'Segoe UI', Ubuntu, Roboto, sans-serif; font-weight: 900; font-size: 52px; fill: url(#titleGrad); }
      .subtitle { font-family: 'Segoe UI', Ubuntu, Roboto, sans-serif; font-weight: 600; font-size: 22px; fill: #e2e8f0; }
      .tag { font-family: 'Segoe UI', Ubuntu, Roboto, sans-serif; font-weight: 500; font-size: 14px; fill: #94a3b8; }
      .badge-text { font-family: 'Segoe UI', Ubuntu, Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #ffffff; }
      
      @keyframes floatCube1 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatCube2 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(18px) rotate(-8deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; }
        50% { opacity: 0.7; }
        100% { opacity: 0.3; }
      }
      
      .animated-cube1 { animation: floatCube1 6s ease-in-out infinite; transform-origin: center; }
      .animated-cube2 { animation: floatCube2 8s ease-in-out infinite; transform-origin: center; }
      .pulse-bg { animation: pulseGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Elements -->
  <circle cx="1000" cy="80" r="180" fill="#6366f1" opacity="0.15" class="pulse-bg" />
  <circle cx="150" cy="280" r="140" fill="#a855f7" opacity="0.12" class="pulse-bg" />

  <!-- Grid lines pattern representing voxel grid -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <path d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200 M0,300 H1200" />
    <path d="M100,0 V350 M200,0 V350 M300,0 V350 M400,0 V350 M500,0 V350 M600,0 V350 M700,0 V350 M800,0 V350 M900,0 V350 M1000,0 V350 M1100,0 V350" />
  </g>

  <!-- Geometric Voxel Art Elements (Isometric Cubes) in Background/Sides -->
  <g class="animated-cube1" opacity="0.35">
    <!-- Cube 1 Right side -->
    <path d="M1020 160 L1070 130 L1120 160 L1070 190 Z" fill="#38bdf8" />
    <path d="M1020 160 L1070 190 L1070 250 L1020 220 Z" fill="#0284c7" />
    <path d="M1070 190 L1120 160 L1120 220 L1070 250 Z" fill="#0369a1" />
  </g>

  <g class="animated-cube2" opacity="0.25">
    <!-- Cube 2 Left side background -->
    <path d="M100 90 L140 65 L180 90 L140 115 Z" fill="#a855f7" />
    <path d="M100 90 L140 115 L140 165 L100 140 Z" fill="#7e22ce" />
    <path d="M140 115 L180 90 L180 140 L140 165 Z" fill="#6b21a8" />
  </g>

  <!-- Foreground Main Content Container -->
  <g transform="translate(80, 0)">
    <!-- Header Pill -->
    <g transform="translate(0, 50)">
      <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="16" cy="16" r="6" fill="#10b981" />
      <text x="32" y="21" class="badge-text">🎮 GAMING ECOSYSTEM INDEX</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title" filter="url(#glow)">Awesome Sandbox Video Game</text>

    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">Top Commercial SaaS Platforms &amp; Open-Source Voxel World Engines</text>

    <!-- Description / Tags -->
    <text x="0" y="225" class="tag">🚀 Open-World Building • Crafting • Physics Simulation • Voxel Engines • Modding</text>

    <!-- Metric Badges Row -->
    <g transform="translate(0, 260)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="160" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
        <text x="15" y="23" class="badge-text" fill="#38bdf8">🌐 10 SaaS Leaders</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(175, 0)">
        <rect width="190" height="36" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
        <text x="15" y="23" class="badge-text" fill="#818cf8">⚡ 28 Open-Source Repos</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(380, 0)">
        <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
        <text x="15" y="23" class="badge-text" fill="#c084fc">⭐ Star-Sorted Repos</text>
      </g>
    </g>
  </g>
</svg>
